<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Gotham', 'Helvetica Neue', Arial, sans-serif; }
body { background: #e3e3e3; color: #333; }

/* ---------- LOGIN ---------- */
#loginPage { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
.login-box { width: 400px; padding: 40px; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.login-logo { text-align: center; font-size: 36px; font-weight: 900; color: #00a2ff; margin-bottom: 20px; }
.login-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
.login-box button { width: 100%; padding: 12px; background: #00a2ff; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; }
.login-box button:active { background: #0090e0; }
.login-note { text-align: center; font-size: 11px; color: #999; margin-top: 10px; }

/* ---------- MAIN ---------- */
#mainPage { display: none; }
#mainPage.active { display: block; }

/* Top nav */
.topnav { background: #232527; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 20px; position: sticky; top: 0; z-index: 100; }
.topnav .logo { color: #fff; font-size: 22px; font-weight: 900; letter-spacing: 1px; }
.topnav .navlink { color: #ccc; font-size: 14px; cursor: pointer; }
.topnav .navlink:hover { color: #fff; }
.topnav .navlink.active { color: #fff; font-weight: 600; }
.topnav .search { flex: 1; max-width: 300px; }
.topnav .search input { width: 100%; padding: 6px 12px; border-radius: 4px; border: none; font-size: 13px; background: #3a3d40; color: #fff; }
.topnav .right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.topnav .robux { color: #00b06f; font-size: 13px; font-weight: 600; }
.topnav .username { color: #fff; font-size: 13px; cursor: pointer; }

/* Content */
.content { max-width: 1100px; margin: 0 auto; padding: 20px; }
.section-title { font-size: 20px; font-weight: 600; margin: 24px 0 12px; color: #000; }
.game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.game-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.1s; }
.game-card:active { transform: scale(0.98); }
.game-thumb { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 48px; background: linear-gradient(135deg, #4a6cf7, #a855f7); }
.game-name { padding: 8px; font-size: 12px; font-weight: 600; color: #000; }

/* Profile */
.profile-header { display: flex; gap: 20px; align-items: center; padding: 24px 0; }
.profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #4a6cf7, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 48px; }
.profile-name { font-size: 24px; font-weight: 700; color: #000; }
.profile-display { font-size: 16px; color: #666; margin-top: 2px; }
.profile-stats { font-size: 13px; color: #888; margin-top: 6px; display: flex; gap: 16px; }
.profile-stats span { font-weight: 700; color: #000; }
.profile-bio { font-size: 14px; color: #444; margin-top: 12px; }

/* Marketplace */
.market-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.mtab { padding: 8px 16px; background: #e0e0e0; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; color: #555; }
.mtab.active { background: #000; color: #fff; }
.market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.market-item { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); cursor: pointer; }
.market-thumb { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 40px; }
.market-thumb.limiteds { background: #ffd700; }
.market-thumb.collectibles { background: #a855f7; }
.market-thumb.ugc { background: #00c8ff; }
.market-info { padding: 8px; }
.market-name { font-size: 11px; font-weight: 600; color: #000; }
.market-price { font-size: 11px; color: #00b06f; font-weight: 700; margin-top: 2px; }
.market-tag { font-size: 9px; color: #ff8c00; font-weight: 700; text-transform: uppercase; }

/* Invisible cheat button */
#cheatTrigger { position: fixed; top: 60px; right: 20px; width: 50px; height: 50px; background: transparent; z-index: 999; cursor: pointer; }

/* Cheat menu */
#cheatMenu { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 320px; background: #1a1a1a; border-radius: 12px; border: 1px solid #333; z-index: 1000; overflow: hidden; }
#cheatMenu.open { display: block; }
.cheat-header { display: flex; justify-content: space-between; padding: 14px 18px; background: #111; border-bottom: 1px solid #333; color: #00c8ff; font-weight: 700; font-size: 14px; }
.cheat-header button { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
.cheat-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; max-height: 500px; overflow-y: auto; }
.cheat-body label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #888; text-transform: uppercase; }
.cheat-body input, .cheat-body select { padding: 8px 10px; background: #222; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
.cheat-body input:focus, .cheat-body select:focus { border-color: #00c8ff; }
.cheat-apply { padding: 10px; background: #00c8ff; border: none; border-radius: 6px; color: #fff; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">ROBLOX</div>
    <input id="loginUser" type="text" placeholder="Username">
    <input id="loginPass" type="password" placeholder="Password">
    <button onclick="doLogin()">Log In</button>
    <div class="login-note">Any username and password work.</div>
  </div>
</div>

<!-- MAIN -->
<div id="mainPage">
  <div class="topnav">
    <div class="logo">ROBLOX</div>
    <div class="navlink active" data-page="home">Home</div>
    <div class="navlink" data-page="market">Marketplace</div>
    <div class="navlink" data-page="profile">Profile</div>
    <div class="search"><input type="text" placeholder="Search"></div>
    <div class="right">
      <div class="robux">R$ <span id="robuxDisplay">0</span></div>
      <div class="username" id="navUsername">Guest1337</div>
    </div>
  </div>

  <div class="content" id="pageHome">
    <div class="section-title">Popular</div>
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <div class="content" id="pageMarket" style="display:none;">
    <div class="market-tabs">
      <button class="mtab active" data-mtab="limiteds">Limiteds</button>
      <button class="mtab" data-mtab="collectibles">Collectibles</button>
      <button class="mtab" data-mtab="ugc">UGC</button>
    </div>
    <div class="market-grid" id="marketGrid"></div>
  </div>

  <div class="content" id="pageProfile" style="display:none;">
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">😎</div>
      <div>
        <div class="profile-name" id="profileName">Guest1337</div>
        <div class="profile-display" id="profileDisplay">@guest1337</div>
        <div class="profile-stats"><span id="friendsCount">0</span> Friends <span id="followersCount">0</span> Followers</div>
      </div>
    </div>
    <div class="profile-bio" id="profileBio">No bio yet.</div>
  </div>

  <div id="cheatTrigger"></div>
</div>

<!-- CHEAT MENU -->
<div id="cheatMenu">
  <div class="cheat-header"><span>Developer Panel</span><button onclick="closeCheat()">×</button></div>
  <div class="cheat-body">
    <label>Display Name<input id="cheatName" type="text"></label>
    <label>Username<input id="cheatUser" type="text"></label>
    <label>Bio<input id="cheatBio" type="text"></label>
    <label>Avatar Emoji<input id="cheatAvatar" type="text"></label>
    <label>Robux<input id="cheatRobux" type="number"></label>
    <label>Verified
      <select id="cheatVerified"><option value="none">None</option><option value="blue">Blue</option><option value="gold">Gold</option></select>
    </label>
    <label>Friends<input id="cheatFriends" type="number"></label>
    <label>Followers<input id="cheatFollowers" type="number"></label>
    <button class="cheat-apply" onclick="applyCheat()">Apply</button>
  </div>
</div>

<script>
const state = { name: 'Guest1337', user: '@guest1337', bio: 'No bio yet.', avatar: '😎', robux: 0, verified: 'none', friends: 0, followers: 0 };

const GAMES = [
  { name: 'Adopt Me!', icon: '🐾' }, { name: 'Brookhaven', icon: '🏠' },
  { name: 'Blox Fruits', icon: '⚔️' }, { name: 'MM2', icon: '🔪' },
  { name: 'Tower of Hell', icon: '🗼' }, { name: 'Jailbreak', icon: '🚓' },
  { name: 'Piggy', icon: '🐷' }, { name: 'Arsenal', icon: '🔫' },
  { name: 'Doors', icon: '🚪' }, { name: 'Bee Swarm', icon: '🐝' },
];

const MARKET = {
  limiteds: [{ n: 'Dominus', i: '👑', p: 1000000 }, { n: 'Fedora', i: '🎩', p: 500000 }, { n: 'Shades', i: '🕶️', p: 250000 }, { n: 'Red Valk', i: '🪖', p: 750000 }],
  collectibles: [{ n: 'Wheel', i: '🎡', p: 150000 }, { n: 'Katana', i: '🗡️', p: 80000 }, { n: 'Shaggy', i: '🧟', p: 95000 }, { n: 'Frost', i: '❄️', p: 60000 }],
  ugc: [{ n: 'Bucket Hat', i: '🧢', p: 250 }, { n: 'Visor', i: '🥽', p: 400 }, { n: 'Ears', i: '🐰', p: 150 }, { n: 'Wings', i: '🦋', p: 600 }],
};

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  if (!u) { alert('Enter a username.'); return; }
  state.name = u;
  state.user = '@' + u.toLowerCase().replace(/\s+/g, '');
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainPage').classList.add('active');
  renderAll();
}

function renderAll() { renderProfile(); renderGames(); renderMarket('limiteds'); }

function renderProfile() {
  let badge = state.verified === 'blue' ? ' ✔️' : state.verified === 'gold' ? ' 🟡' : '';
  document.getElementById('profileName').textContent = state.name + badge;
  document.getElementById('profileDisplay').textContent = state.user;
  document.getElementById('profileBio').textContent = state.bio;
  document.getElementById('profileAvatar').textContent = state.avatar;
  document.getElementById('friendsCount').textContent = state.friends.toLocaleString();
  document.getElementById('followersCount').textContent = state.followers.toLocaleString();
  document.getElementById('robuxDisplay').textContent = state.robux.toLocaleString();
  document.getElementById('navUsername').textContent = state.name;
}

function renderGames() {
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';
  GAMES.forEach(g => {
    const el = document.createElement('div');
    el.className = 'game-card';
    el.innerHTML = `<div class="game-thumb">${g.icon}</div><div class="game-name">${g.name}</div>`;
    el.onclick = () => alert('Games cannot be played in this LARP.');
    grid.appendChild(el);
  });
}

function renderMarket(tab) {
  const grid = document.getElementById('marketGrid');
  grid.innerHTML = '';
  MARKET[tab].forEach(item => {
    const el = document.createElement('div');
    el.className = 'market-item';
    el.innerHTML = `<div class="market-thumb ${tab}">${item.i}</div><div class="market-info"><div class="market-name">${item.n}</div><div class="market-tag">${tab.toUpperCase()}</div><div class="market-price">R$ ${item.p.toLocaleString()}</div></div>`;
    el.onclick = () => {
      if (state.robux >= item.p) { state.robux -= item.p; renderProfile(); alert(`Purchased ${item.n}!`); }
      else alert(`Not enough Robux.`);
    };
    grid.appendChild(el);
  });
}

document.querySelectorAll('.navlink').forEach(nav => {
  nav.onclick = () => {
    document.querySelectorAll('.navlink').forEach(n => n.classList.remove('active'));
    nav.classList.add('active');
    document.getElementById('pageHome').style.display = 'none';
    document.getElementById('pageMarket').style.display = 'none';
    document.getElementById('pageProfile').style.display = 'none';
    document.getElementById('page' + nav.dataset.page.charAt(0).toUpperCase() + nav.dataset.page.slice(1)).style.display = 'block';
  };
});

document.querySelectorAll('.mtab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.mtab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    renderMarket(t.dataset.mtab);
  };
});

document.getElementById('cheatTrigger').onclick = () => {
  document.getElementById('cheatMenu').classList.add('open');
  document.getElementById('cheatName').value = state.name;
  document.getElementById('cheatUser').value = state.user;
  document.getElementById('cheatBio').value = state.bio;
  document.getElementById('cheatAvatar').value = state.avatar;
  document.getElementById('cheatRobux').value = state.robux;
  document.getElementById('cheatVerified').value = state.verified;
  document.getElementById('cheatFriends').value = state.friends;
  document.getElementById('cheatFollowers').value = state.followers;
};

function closeCheat() { document.getElementById('cheatMenu').classList.remove('open'); }

function applyCheat() {
  state.name = document.getElementById('cheatName').value || 'Guest1337';
  state.user = document.getElementById('cheatUser').value || '@guest1337';
  state.bio = document.getElementById('cheatBio').value || 'No bio yet.';
  state.avatar = document.getElementById('cheatAvatar').value || '😎';
  state.robux = parseInt(document.getElementById('cheatRobux').value) || 0;
  state.verified = document.getElementById('cheatVerified').value;
  state.friends = parseInt(document.getElementById('cheatFriends').value) || 0;
  state.followers = parseInt(document.getElementById('cheatFollowers').value) || 0;
  renderProfile();
  closeCheat();
}
</script>
</body>
</html>
